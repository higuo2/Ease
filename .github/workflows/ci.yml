name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ease.xcodeproj \
            -scheme Ease \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -only-testing:EaseTests \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS= \
            | xcbeautify
