# Push a tag like v1.0.1 to test, sign, and upload Ease to TestFlight.
# Secrets: APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8
name: CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ] || [ -z "${ASC_KEY_P8}" ]; then
            echo "::error::Add GitHub secrets APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, and APPSTORE_API_KEY_P8."
            exit 1
          fi
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) ;;
            *)
              echo "::error::APPSTORE_API_KEY_P8 must be the .p8 file text, including BEGIN PRIVATE KEY."
              exit 1
              ;;
          esac
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ease.xcodeproj \
            -scheme Ease \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -only-testing:EaseTests \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS= \
            | xcbeautify

      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          args=(CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "::error::Tag must look like v1.0.1"
              exit 1
            fi
            args+=(MARKETING_VERSION="$version")
          fi
          key="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild archive \
            -project Ease.xcodeproj \
            -scheme Ease \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ease.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            "${args[@]}" \
            | xcbeautify
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>2PV7Q2V4NN</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ease.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify
          ipa="$RUNNER_TEMP/export/Ease.ipa"
          xcrun iTMSTransporter -m upload -assetFile "$ipa" -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID"
